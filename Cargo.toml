[package]
name = "labwhere"
version = "0.1.0"
edition = "2018"

[dependencies]
regex = "1.11.0"
once_cell = "1.21.0"
tokio = { version = "1.44.1", features = ["full"] }
sqlx = { version = "0.8.2", features = [ "runtime-tokio", "sqlite", "macros" ] }
hyper = "1.5.2"
http-body-util = "0.1.3"
hyper-util = { version = "0.1", features = ["full"] }
env_logger = "0.11.7"
log = "0.4.26"
http-body = "1.0.1"
serde_json = "1.0.140"
serde = { version = "1.0.219", features = ["derive"] }
